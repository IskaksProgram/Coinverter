<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coinverter — Global currencies. Digital assets. One standard.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23A58B5B' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<header class="top"><a class="brand" href="index.html"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#A58B5B" stroke-width="1.5"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#786442"/><path d="M20 12.5a5.5 5.5 0 1 0 0 7" fill="none" stroke="#A58B5B" stroke-width="1.8" stroke-linecap="round"/></svg><span>Coinverter</span></a>
<nav><a href="index.html" class="on">Home</a></nav><div class="status" id="status">Loading…</div></header>
<main>
<section class="hero"><h1>COINVERTER</h1><p>Global currencies. Digital assets. One standard.</p></section>
<section class="card calc">
<label class="f"><span>Amount</span><input id="amount" type="number" inputmode="decimal" min="0" step="any" value="100"></label>
<div class="row"><label class="f"><span>From</span><select id="from"></select></label>
<button id="swap" class="ghost" title="Swap" aria-label="Swap">⇄</button>
<label class="f"><span>To</span><select id="to"></select></label></div>
<div class="result"><div id="result">—</div><div id="rate" class="muted"></div></div>
<div class="actions"><button id="copy" class="ghost">Copy result</button></div>
</section>
<section><h2>Popular</h2><div class="grid" id="popular"></div><p class="muted note">Prices shown in USD. 24h change is available for crypto only.</p></section>
</main>
<footer>Informational tool only. Not financial advice.</footer>
<div id="toast" class="toast"></div>
<script src="api.js"></script><script src="converter.js"></script><script src="app.js"></script>
</body></html>
